<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b19">
  <title>十七份礼物</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <canvas id="introParticles" aria-hidden="true"></canvas>
  <div id="sparkleLayer" aria-hidden="true"></div>
  <main class="experience" id="experience" data-stage="intro">
    <section class="scene intro-scene" aria-labelledby="intro-title">
      <p class="eyebrow" id="introEyebrow">FOR XINGJING</p>
      <div class="intro-copy">
        <p class="date-mark" id="introDate">A birthday night</p>
        <h1 id="intro-title">今晚，想送你<br><em>十七份礼物</em></h1>
        <p id="introMessage">它们不是礼物盒里装得下的东西，<br>是我们一起经过的那些时刻。</p>
      </div>
      <button class="primary-action" id="beginButton" type="button">拆开第一份</button>
      <p class="sound-note" id="soundNote">建议戴上耳机</p>
    </section>

    <section class="scene memory-scene" aria-live="polite">
      <header class="chapter-header">
        <h2 id="chapter-title"></h2>
      </header>
      <div class="memory-stage" id="memoryStage">
        <p class="chapter-note" id="chapter-note"></p>
        <div class="photo-grid" id="photoGrid"></div>
      </div>
      <div class="chapter-footer">
        <p class="chapter-line" id="chapter-line"></p>
        <button class="next-action" id="nextButton" type="button">打开下一份</button>
      </div>
    </section>

    <section class="scene finale-scene" aria-live="polite">
      <p class="eyebrow">THE LAST GIFT</p>
      <div class="constellation" id="constellation" aria-hidden="true"></div>
      <p class="final-kicker">邢静</p>
      <h2>生日快乐</h2>
      <p class="final-message">愿你永远明亮、自在、被好好爱着。<br>也愿我们把以后的日子，继续过成值得珍藏的故事。</p>
      <p class="signature">谢谢你来到这世上，也谢谢你走进我的世界。</p>
      <button class="restart-action" id="restartButton" type="button">再看一次</button>
    </section>
  </main>

  <audio id="music" preload="auto" autoplay loop>
    <source src="https://wangwenjun587-byte.github.io/birthday/music/%E6%A3%B1%E9%95%9C%E4%B9%90%E9%98%9F-%E5%85%8B%E6%9E%97.mp3" type="audio/mpeg">
  </audio>
  <script src="app.js"></script>
</body>
</html>
