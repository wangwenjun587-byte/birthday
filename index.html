<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0118">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🎂 生日快乐 🎂</title>
<style>
/* ============================================================
   基础重置
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #0a0118;
  font-family: 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', sans-serif;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}

/* ============================================================
   深色渐变星空背景
   ============================================================ */
.bg-gradient {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(76,0,130,0.35) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(25,25,112,0.45) 0%, transparent 50%),
    linear-gradient(135deg, #1a0a2e 0%, #0f0524 30%, #0a1128 70%, #0d1b3a 100%);
}

/* ============================================================
   画布层
   ============================================================ */
#stars-canvas    { position: fixed; inset: 0; z-index: 1; }
#particle-canvas { position: fixed; inset: 0; z-index: 3; pointer-events: none; }

/* ============================================================
   霓虹文字
   ============================================================ */
#neon-text {
  position: fixed; top: 42%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 4; width: 100%; text-align: center;
  pointer-events: none; opacity: 0;
  transition: opacity 2.5s ease-in, filter 0.6s;
}
#neon-text.show { opacity: 1; }
/* 显示照片时霓虹文字略微变暗，不抢戏 */
#neon-text.dim { filter: brightness(0.35); }

#neon-text .main-text {
  font-size: min(8vw, 72px);
  font-weight: bold; color: #fff; letter-spacing: 2px;
  text-shadow:
    0 0 5px #fff, 0 0 10px #fff,
    0 0 20px #ff69b4, 0 0 40px #ff69b4, 0 0 80px #ff1493;
  animation: breathe 3s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% {
    text-shadow: 0 0 5px #fff,0 0 10px #fff,0 0 20px #ff69b4,0 0 40px #ff69b4,0 0 70px #ff1493;
    transform: scale(1);
  }
  50% {
    text-shadow: 0 0 8px #fff,0 0 16px #fff,0 0 32px #ff1493,0 0 60px #ff1493,0 0 100px #ff1493;
    transform: scale(1.03);
  }
}

#neon-text .dedication {
  font-size: min(3.5vw, 22px);
  color: #ffd700; margin-top: 2.5em; letter-spacing: 6px;
  text-shadow: 0 0 5px #ffd700,0 0 15px #ffd700,0 0 30px #ffa500;
  animation: breathe-gold 3s ease-in-out infinite 0.5s;
  opacity: 0; transition: opacity 2s ease-in 1s;
}
#neon-text.show .dedication { opacity: 0.9; }

@keyframes breathe-gold {
  0%,100% { text-shadow: 0 0 5px #ffd700,0 0 15px #ffd700,0 0 30px #ffa500; }
  50%     { text-shadow: 0 0 10px #ffd700,0 0 25px #ffd700,0 0 50px #ff8c00; }
}

/* ============================================================
   飘落爱心
   ============================================================ */
.heart {
  position: fixed; z-index: 2; pointer-events: none;
  will-change: transform;
  animation: heart-fall linear forwards;
}
@keyframes heart-fall {
  0%   { transform: translateY(-30px) translateX(0) rotate(0deg);   opacity: 0; }
  10%  { opacity: 0.6; }
  50%  { transform: translateY(50vh)  translateX(20px) rotate(180deg); }
  90%  { opacity: 0.6; }
  100% { transform: translateY(105vh) translateX(-10px) rotate(360deg); opacity: 0; }
}

/* ============================================================
   照片组展示 —— 拍立得 + 柔光淡入
   ============================================================ */
#photo-stage {
  position: fixed; inset: 0; z-index: 6;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  pointer-events: none; padding: 20px;
}

.photo-group {
  display: grid;
  gap: 16px;
  justify-content: center;
  align-items: center;
  max-width: 92vw;
}

/* ===== 简化布局：只按数量分，所有照片统一竖图尺寸 ===== */
.photo-group.count-1 { grid-template-columns: 1fr; }
.photo-group.count-2 { grid-template-columns: repeat(2, 1fr); }
.photo-group.count-3 { grid-template-columns: repeat(3, 1fr); }
.photo-group.count-4 { grid-template-columns: repeat(2, 1fr); }

.polaroid {
  background: #fdfdfd;
  padding: 8px 8px 6px 8px;
  border-radius: 3px;
  box-shadow:
    0 10px 40px rgba(0,0,0,0.5),
    0 3px 12px rgba(0,0,0,0.3),
    inset 0 0 0 1px rgba(255,255,255,0.1);
  opacity: 0;
  /* 完全摆正，不旋转 */
  transform: translateY(80px) scale(0.75);
  transition:
    opacity 0.9s ease-out,
    transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
  will-change: transform, opacity;
  /* 让拍立得在 grid 单元里居中，避免拉伸 */
  justify-self: center;
  max-width: 100%;
}
.polaroid.show {
  opacity: 1;
  transform: translateY(0) scale(1);
}
.polaroid.fade-out {
  opacity: 0;
  transform: translateY(-40px) scale(0.9);
  transition: opacity 0.5s, transform 0.5s;
}

/* 拍立得照片区域 —— 完整显示不裁切，加深底色衬托留白 */
.polaroid .img-wrap {
  width: var(--pw, 200px);
  height: var(--ph, 240px);
  overflow: hidden;
  border-radius: 2px;
  background: #1a1a1a;
  display: flex;
  align-items: center;
  justify-content: center;
}
.polaroid .img-wrap img {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;   /* 完整显示，不裁切 */
  display: block;
}

/* 拍立得底部手写文案 */
.polaroid .cap {
  text-align: center;
  padding: 8px 4px 4px;
  font-family: 'KaiTi', 'STKaiti', '楷体', cursive;
  font-size: 12px;
  color: #555;
  letter-spacing: 1px;
  min-height: 20px;
}

/* ============================================================
   组文案 —— 更醒目 + 6 种入场动画（按组循环）
   ============================================================ */
.group-caption {
  margin-top: 30px;
  text-align: center;
  font-family: 'KaiTi', 'STKaiti', '楷体', serif;
  font-size: min(6.5vw, 30px);
  font-weight: bold;
  color: #fff;
  letter-spacing: 5px;
  text-shadow:
    0 0 6px #fff,
    0 0 16px #ffd700,
    0 0 32px #ff8c00,
    0 0 56px #ff1493;
  opacity: 0;
  max-width: 88vw;
  padding: 12px 28px;
  line-height: 1.7;
}
.group-caption.show { opacity: 1; }
.group-caption .gc-text { display: inline-block; }

/* 动画 0 · 打字机：逐字浮现（配合 JS 拆字 + 逐字 delay） */
.cap-anim-0 .gc-text span {
  opacity: 0;
  display: inline-block;
  animation: char-in 0.5s ease-out forwards;
}
@keyframes char-in {
  from { opacity: 0; transform: translateY(16px) scale(0.6); filter: blur(6px); }
  to   { opacity: 1; transform: translateY(0)    scale(1);   filter: blur(0); }
}

/* 动画 1 · 从下方弹跳上来 */
.cap-anim-1 { transform: translateY(50px) scale(0.8); filter: blur(4px); }
.cap-anim-1.show { transform: translateY(0) scale(1); filter: blur(0);
  transition: transform 0.8s cubic-bezier(0.34,1.56,0.64,1), filter 0.6s; }

/* 动画 2 · 模糊聚焦 */
.cap-anim-2 { filter: blur(24px); transform: scale(1.15); }
.cap-anim-2.show { filter: blur(0); transform: scale(1);
  transition: filter 1s ease-out, transform 1s ease-out; }

/* 动画 3 · 字间距收紧（从散到聚） */
.cap-anim-3 { letter-spacing: 34px; opacity: 0; filter: blur(2px); }
.cap-anim-3.show { letter-spacing: 5px; opacity: 1; filter: blur(0);
  transition: letter-spacing 1s ease-out, opacity 0.8s, filter 0.8s; }

/* 动画 4 · 从左侧揭开滑入 */
.cap-anim-4 { transform: translateX(-70px); opacity: 0; clip-path: inset(0 100% 0 0); }
.cap-anim-4.show { transform: translateX(0); opacity: 1; clip-path: inset(0 0 0 0);
  transition: transform 0.9s cubic-bezier(0.22,1,0.36,1), opacity 0.9s, clip-path 0.9s; }

/* 动画 5 · 从右侧揭开滑入 */
.cap-anim-5 { transform: translateX(70px); opacity: 0; clip-path: inset(0 0 0 100%); }
.cap-anim-5.show { transform: translateX(0); opacity: 1; clip-path: inset(0 0 0 0);
  transition: transform 0.9s cubic-bezier(0.22,1,0.36,1), opacity 0.9s, clip-path 0.9s; }

/* ============================================================
   点击提示
   ============================================================ */
#hint {
  position: fixed; bottom: 30px; left: 50%;
  transform: translateX(-50%); z-index: 5;
  color: rgba(255,255,255,0.4);
  font-size: clamp(12px,3vw,16px); letter-spacing: 2px;
  pointer-events: none; transition: opacity 1s;
  animation: hint-pulse 2.5s ease-in-out infinite;
}
#hint.hidden { opacity: 0 !important; }
@keyframes hint-pulse { 0%,100%{opacity:.3} 50%{opacity:.7} }

/* 音乐静音提示 */
#music-hint {
  position: fixed; top: 18px; left: 50%;
  transform: translateX(-50%); z-index: 8;
  background: rgba(255,105,180,0.18);
  border: 1px solid rgba(255,105,180,0.4);
  color: #ffd0e8;
  font-size: clamp(12px,3vw,15px); letter-spacing: 1px;
  padding: 8px 18px; border-radius: 20px;
  pointer-events: none;
  backdrop-filter: blur(6px);
  opacity: 0; transition: opacity 0.8s;
  animation: hint-pulse 2.5s ease-in-out infinite;
}
#music-hint.show { opacity: 1; }
#music-hint.hidden { opacity: 0 !important; }
</style>
</head>
<body>

<!-- 深色渐变星空背景 -->
<div class="bg-gradient"></div>

<!-- 闪烁星星画布 -->
<canvas id="stars-canvas"></canvas>

<!-- 粒子画布（汇聚 + 点击特效） -->
<canvas id="particle-canvas"></canvas>

<!-- 霓虹文字 -->
<div id="neon-text">
  <div class="main-text">🎂 生日快乐 🎂</div>
  <div class="dedication">献给 邢静</div>
</div>

<!-- 照片组展示舞台 -->
<div id="photo-stage">
  <div class="photo-group" id="photo-group"></div>
  <div class="group-caption" id="group-caption"></div>
</div>

<!-- 背景音乐：autoplay+muted 先静音自动播放（浏览器允许），再尝试取消静音 -->
<audio id="bg-music" loop preload="auto" autoplay muted>
  <source src="./music/棱镜乐队-克林.mp3" type="audio/mpeg">
</audio>

<!-- 音乐提示（仅当音乐仍静音时显示，提示用户轻触取消静音） -->
<div id="music-hint">🎵 轻触屏幕，开启音乐</div>

<!-- 点击提示 -->
<div id="hint">✨ 轻触屏幕，翻开我们的时光 ✨</div>

<script>
'use strict';

/* ============================================================
   配置区
   ============================================================ */
const TEXT      = '🎂 生日快乐 🎂';
const PHOTO_DIR = './photo_min/';

// 粒子颜色：粉、金、紫、暖橙
const COLORS = [
  '#FF69B4','#FF1493','#FFB6C1',
  '#FFD700','#FFA500','#FFB347',
  '#9370DB','#8A2BE2','#BA55D3',
  '#FF8C00','#FF6347','#FF7F50'
];

/* ----- 21 组照片文案（可自由修改） -----
   按顺序对应第 1~21 组照片，每组 2~4 张，方向智能搭配 */
const CAPTIONS = [
  '初见你的那一刻，星河都暗了',
  '你笑起来，整个世界都在发光',
  '那些一起走过的路，都是甜的',
  '有你的日子，时间总是不够用',
  '你是我最想留住的幸运',
  '每一张照片，都藏着我的喜欢',
  '你的眼睛里，有我看不够的温柔',
  '和你的每个瞬间，都值得被记住',
  '你是我所有等待的答案',
  '想牵你的手，走很长很长的路',
  '你出现后，所有的歌都有了主角',
  '世间所有的美好，都不及你',
  '我喜欢你，比昨天多，比明天少',
  '你的笑，是我见过最好的光',
  '愿往后余生，四季都有你',
  '生日快乐，我最爱的人',
  '邢静，谢谢你来到这世上',
  '愿我们的故事，写到很久很久'
];

/* 照片配置：68张分17组，每组4张
   所有照片统一按竖图处理，按数量自动排列 */
const PHOTOS_PER_GROUP = 4;
const PHOTO_COUNT = 68;

/* ============================================================
   画布与 DOM
   ============================================================ */
const starsCanvas    = document.getElementById('stars-canvas');
const starsCtx       = starsCanvas.getContext('2d');
const particleCanvas = document.getElementById('particle-canvas');
const particleCtx    = particleCanvas.getContext('2d');
const neonText       = document.getElementById('neon-text');
const hint           = document.getElementById('hint');
const music          = document.getElementById('bg-music');
const photoGroupEl   = document.getElementById('photo-group');
const groupCaptionEl = document.getElementById('group-caption');

let W = 0, H = 0;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  starsCanvas.width    = W;  starsCanvas.height    = H;
  particleCanvas.width = W;  particleCanvas.height = H;
}
resize();

/* ============================================================
   星空：闪烁星星
   ============================================================ */
let stars = [];

function initStars() {
  stars = [];
  const count = Math.floor((W * H) / 2500);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.2 + 0.3,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      phase: Math.random() * Math.PI * 2,
      baseAlpha: Math.random() * 0.6 + 0.3
    });
  }
}
initStars();

function drawStars() {
  starsCtx.clearRect(0, 0, W, H);
  for (const s of stars) {
    s.phase += s.twinkleSpeed;
    const a = ((Math.sin(s.phase) + 1) / 2) * s.baseAlpha;
    starsCtx.fillStyle = `rgba(255,240,220,${a})`;
    starsCtx.beginPath();
    starsCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    starsCtx.fill();
    if (s.r > 1) {
      starsCtx.strokeStyle = `rgba(255,240,220,${a * 0.3})`;
      starsCtx.lineWidth = 0.5;
      starsCtx.beginPath();
      starsCtx.moveTo(s.x - s.r * 3, s.y);
      starsCtx.lineTo(s.x + s.r * 3, s.y);
      starsCtx.moveTo(s.x, s.y - s.r * 3);
      starsCtx.lineTo(s.x, s.y + s.r * 3);
      starsCtx.stroke();
    }
  }
}

/* ============================================================
   飘落爱心
   ============================================================ */
const HEART_EMOJIS = ['💖','💕','💗','❤️','🩷'];

function createHeart() {
  const el = document.createElement('div');
  el.className = 'heart';
  el.textContent = HEART_EMOJIS[Math.floor(Math.random() * HEART_EMOJIS.length)];
  el.style.left     = Math.random() * 100 + 'vw';
  el.style.fontSize = (Math.random() * 14 + 10) + 'px';
  const dur         = Math.random() * 4 + 6;
  el.style.animationDuration = dur + 's';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), dur * 1000 + 500);
}
setInterval(createHeart, 600);

/* ============================================================
   粒子系统：最小粒子从四面八方汇聚成文字
   ============================================================ */
let particles = [];
let converged = false;

function sampleTextTargets() {
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const ctx = off.getContext('2d');

  const fontSize = Math.min(W * 0.08, 72);
  ctx.font = `bold ${fontSize}px 'Microsoft YaHei','PingFang SC',Arial,sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText(TEXT, W / 2, H * 0.42);

  const data = ctx.getImageData(0, 0, W, H).data;
  const targets = [];
  // 最小粒子：采样间隔更小 → 粒子更密更细
  const gap = W < 600 ? 2 : 3;
  for (let y = 0; y < H; y += gap) {
    for (let x = 0; x < W; x += gap) {
      if (data[(y * W + x) * 4 + 3] > 128) targets.push({ x, y });
    }
  }
  return targets;
}

function initParticles() {
  const targets = sampleTextTargets();
  particles = [];
  converged = false;
  neonText.classList.remove('show');

  for (const t of targets) {
    // 从四面八方随机起点（不只是四条边，还包括四角）
    const angle = Math.random() * Math.PI * 2;
    const dist  = Math.max(W, H) * (0.6 + Math.random() * 0.5);
    const sx = W / 2 + Math.cos(angle) * dist;
    const sy = H * 0.42 + Math.sin(angle) * dist;

    particles.push({
      x: sx, y: sy,
      tx: t.x, ty: t.y,
      color: COLORS[(Math.random() * COLORS.length) | 0],
      // 最小粒子尺寸 0.8 ~ 1.6
      size: Math.random() * 0.8 + 0.8,
      delay: Math.random() * 60,
      phase: Math.random() * Math.PI * 2
    });
  }
}
initParticles();

function drawConvergingParticles() {
  let allArrived = true;
  const now = Date.now();

  for (const p of particles) {
    if (p.delay > 0) { p.delay--; allArrived = false; continue; }

    const dx = p.tx - p.x, dy = p.ty - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > 1) {
      p.x += dx * 0.045;
      p.y += dy * 0.045;
      allArrived = false;
    } else {
      const t = now * 0.001;
      p.x = p.tx + Math.sin(t + p.phase) * 1.2;
      p.y = p.ty + Math.cos(t + p.phase) * 1.2;
    }

    const tw = converged
      ? (Math.sin(now * 0.003 + p.phase) + 1) / 2 * 0.35 + 0.65
      : 0.8;

    // 光晕
    particleCtx.globalAlpha = tw * 0.22;
    particleCtx.fillStyle = p.color;
    particleCtx.beginPath();
    particleCtx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2);
    particleCtx.fill();
    // 亮点
    particleCtx.globalAlpha = tw;
    particleCtx.beginPath();
    particleCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    particleCtx.fill();
  }

  if (allArrived && !converged) {
    converged = true;
    neonText.classList.add('show');
  }
}

/* ============================================================
   点击 / 触摸特效：星光扩散 + 中心光圈
   ============================================================ */
const clickEffects = [];

function triggerBurst(x, y) {
  const count = 32;
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
    const speed = Math.random() * 5 + 3;
    clickEffects.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: Math.random() * 0.015 + 0.012,
      color: COLORS[(Math.random() * COLORS.length) | 0],
      size: Math.random() * 2.5 + 1.5
    });
  }
  // 中心光圈
  clickEffects.push({
    x, y, vx: 0, vy: 0,
    life: 1, decay: 0.035,
    color: '#fff', size: 0, isRing: true, ringSize: 0
  });
}

function drawClickEffects() {
  for (let i = clickEffects.length - 1; i >= 0; i--) {
    const e = clickEffects[i];

    if (e.isRing) {
      e.ringSize += 4;
      e.life -= e.decay;
      if (e.life <= 0) { clickEffects.splice(i, 1); continue; }
      particleCtx.globalAlpha = e.life * 0.5;
      particleCtx.strokeStyle = e.color;
      particleCtx.lineWidth = 2;
      particleCtx.beginPath();
      particleCtx.arc(e.x, e.y, e.ringSize, 0, Math.PI * 2);
      particleCtx.stroke();
      continue;
    }

    e.x += e.vx;  e.y += e.vy;
    e.vy += 0.12;
    e.vx *= 0.98;
    e.life -= e.decay;
    if (e.life <= 0) { clickEffects.splice(i, 1); continue; }

    particleCtx.globalAlpha = e.life * 0.3;
    particleCtx.fillStyle = e.color;
    particleCtx.beginPath();
    particleCtx.arc(e.x, e.y, e.size * 2.5, 0, Math.PI * 2);
    particleCtx.fill();
    particleCtx.globalAlpha = e.life;
    particleCtx.beginPath();
    particleCtx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
    particleCtx.fill();
  }
}

/* ============================================================
   照片分组 + 拍立得展示系统
   ------------------------------------------------------------
   - 66 张照片分 21 组，每组 2~4 张，方向智能搭配
   - 66 张照片分 17 组，前 16 组各 4 张，最后一组 2 张
   - 所有照片统一按竖图处理，按数量自动排列（2并排/3一排/4×2）
   - object-fit:contain 完整显示不裁切
   - 每组配一句文案，6 种入场动画循环
   ============================================================ */

// 构建照片组数据
const photoGroups = [];
for (let i = 0; i < PHOTO_COUNT; i += PHOTOS_PER_GROUP) {
  const imgs = [];
  for (let j = i; j < Math.min(i + PHOTOS_PER_GROUP, PHOTO_COUNT); j++) {
    imgs.push(PHOTO_DIR + String(j + 1).padStart(2, '0') + '.jpg');
  }
  photoGroups.push({
    images: imgs,
    caption: CAPTIONS[photoGroups.length] || ''
  });
}

let currentGroupIdx = -1;
let isTransitioning = false;

/**
 * 统一竖图尺寸：按组内张数决定单张大小
 * 1张→大、2张→中、3张→小、4张→2×2中
 */
function getPolaroidSize(count) {
  const isMobile = W < 600;
  let pw, ph;
  if (count === 1) {
    pw = isMobile ? Math.min(W * 0.72, 320) : 340;
  } else if (count === 2) {
    pw = isMobile ? Math.min(W * 0.44, 160) : 190;
  } else if (count === 3) {
    pw = isMobile ? Math.min(W * 0.30, 105) : 130;
  } else { // 4张 2×2
    pw = isMobile ? Math.min(W * 0.44, 160) : 190;
  }
  // 竖图比例统一用 0.68（你的照片比例在 0.56~0.75 之间，折中）
  ph = Math.round(pw / 0.68);
  return { pw, ph };
}

/** 显示下一组照片 */
function showNextGroup() {
  if (isTransitioning) return;
  isTransitioning = true;

  // 霓虹文字变暗
  neonText.classList.add('dim');

  // 淡出当前组
  const oldPolaroids = photoGroupEl.querySelectorAll('.polaroid');
  const oldCaption   = groupCaptionEl;

  if (oldPolaroids.length > 0) {
    oldPolaroids.forEach(p => p.classList.add('fade-out'));
    oldCaption.classList.remove('show');
  }

  // 等淡出后渲染新组
  const fadeOutTime = oldPolaroids.length > 0 ? 550 : 0;

  setTimeout(() => {
    currentGroupIdx = (currentGroupIdx + 1) % photoGroups.length;
    const group = photoGroups[currentGroupIdx];
    const count = group.images.length;

    // 清空并重建，按数量设置布局 class
    photoGroupEl.innerHTML = '';
    photoGroupEl.className = 'photo-group count-' + count;

    const { pw, ph } = getPolaroidSize(count);

    // 创建拍立得卡片 —— 统一竖图尺寸
    group.images.forEach((src, idx) => {
      const card = document.createElement('div');
      card.className = 'polaroid';
      card.style.setProperty('--pw', pw + 'px');
      card.style.setProperty('--ph', ph + 'px');

      const imgWrap = document.createElement('div');
      imgWrap.className = 'img-wrap';

      const img = document.createElement('img');
      img.src = src;
      img.decoding = 'async';
      imgWrap.appendChild(img);

      card.appendChild(imgWrap);
      photoGroupEl.appendChild(card);

      // 错峰飘入：每张延迟 180ms
      setTimeout(() => card.classList.add('show'), 180 * idx + 80);
    });

    // 组文案 —— 6 种入场动画按组循环
    const animType = currentGroupIdx % 6;
    const animClass = 'cap-anim-' + animType;
    groupCaptionEl.className = 'group-caption ' + animClass;

    if (animType === 0) {
      // 打字机：逐字浮现
      const text = group.caption;
      const wrap = document.createElement('span');
      wrap.className = 'gc-text';
      [...text].forEach((ch, i) => {
        const s = document.createElement('span');
        s.textContent = ch === ' ' ? '\u00A0' : ch;
        s.style.animationDelay = (i * 0.08) + 's';
        wrap.appendChild(s);
      });
      groupCaptionEl.innerHTML = '';
      groupCaptionEl.appendChild(wrap);
    } else {
      groupCaptionEl.textContent = group.caption;
    }

    const captionDelay = (animType === 0)
      ? 180 * count + 200
      : 180 * count + 250;
    setTimeout(() => groupCaptionEl.classList.add('show'), captionDelay);

    // 解锁
    setTimeout(() => { isTransitioning = false; }, 180 * count + 800);
  }, fadeOutTime);
}

/* ============================================================
   背景音乐 —— 进页面就播放
   策略：autoplay+muted 静音自动播放（浏览器允许）
        → 尝试取消静音（多数桌面端可成功）
        → 失败则显示"轻触开启音乐"提示，首次交互时取消静音
   ============================================================ */
let musicUnmuted = false;
const musicHint = document.getElementById('music-hint');

// 监听播放状态
music.addEventListener('playing', () => {
  console.log('[音乐] 已开始播放（静音状态）');
  // 静音播放成功后，尝试取消静音
  tryUnmute();
}, false);
music.addEventListener('error', (e) => {
  console.warn('[音乐] 加载错误:', music.error);
}, false);

/** 尝试取消静音 + 恢复音量 */
function tryUnmute() {
  if (musicUnmuted) return;
  try {
    music.muted = false;
    music.volume = 0.7;
    // 验证是否真的取消静音了
    if (!music.muted) {
      musicUnmuted = true;
      musicHint.classList.remove('show');
      musicHint.classList.add('hidden');
      console.log('[音乐] 已取消静音，正常播放');
    }
  } catch (err) {
    console.warn('[音乐] 取消静音失败:', err);
  }
}

// 静音播放启动后，定期尝试取消静音（应对时序）
let unmuteTimer = setInterval(() => {
  if (musicUnmuted) { clearInterval(unmuteTimer); return; }
  if (!music.paused) tryUnmute();
}, 800);

// 5 秒后还没取消静音 → 显示提示
setTimeout(() => {
  if (!musicUnmuted) {
    musicHint.classList.add('show');
    console.log('[音乐] 静音中，等待用户交互取消静音');
  }
}, 5000);

// 确保静音播放启动
music.play().catch(() => {});

/* ============================================================
   交互事件
   ============================================================ */
let hintHidden = false;

function handleInteraction(x, y) {
  // 首次交互：取消静音（用户手势上下文，浏览器一定允许）
  if (!musicUnmuted) {
    music.muted = false;
    music.volume = 0.7;
    musicUnmuted = true;
    musicHint.classList.add('hidden');
    // 如果还没在播，也启动播放
    if (music.paused) music.play().catch(() => {});
    console.log('[音乐] 用户交互后取消静音');
  }
  triggerBurst(x, y);
  showNextGroup();
  if (!hintHidden) { hint.classList.add('hidden'); hintHidden = true; }
}

document.addEventListener('click', (e) => handleInteraction(e.clientX, e.clientY));
document.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  handleInteraction(t.clientX, t.clientY);
}, { passive: true });

/* ============================================================
   窗口大小变化
   ============================================================ */
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    resize();
    initStars();
    initParticles();
  }, 300);
});

/* ============================================================
   主渲染循环
   ============================================================ */
function animate() {
  drawStars();

  particleCtx.clearRect(0, 0, W, H);
  particleCtx.globalCompositeOperation = 'lighter';

  drawConvergingParticles();
  drawClickEffects();

  particleCtx.globalAlpha = 1;
  particleCtx.globalCompositeOperation = 'source-over';

  requestAnimationFrame(animate);
}
animate();
</script>
